  <text x="88" y="304" class="muted" font-size="20">Your contacts are protected by</text>
  <text x="88" y="334" class="muted" font-size="20">Neon Row Level Security.</text>
  <rect x="322" y="264" width="126" height="52" rx="8" class="button"/>
  <text x="354" y="297" class="ink" font-size="20" font-weight="700">Sign out</text>
  <text x="88" y="360" class="teal" font-size="19">Signed in.</text>

  <rect x="64" y="405" width="410" height="420" rx="8" class="card"/>
  <text x="88" y="454" class="ink" font-size="28" font-weight="700">Add Contact</text>
  <text x="88" y="486" class="muted" font-size="20">Capture the people you want to keep warm.</text>
  <text x="88" y="538" class="ink" font-size="18" font-weight="700">Name</text>
  <rect x="88" y="558" width="336" height="50" rx="8" class="button"/>
  <text x="108" y="591" class="muted" font-size="20">Alex Morgan</text>
  <text x="88" y="650" class="ink" font-size="18" font-weight="700">Company</text>
  <rect x="88" y="670" width="154" height="50" rx="8" class="button"/>
  <text x="106" y="703" class="muted" font-size="18">Berkeley Haas</text>
  <text x="272" y="650" class="ink" font-size="18" font-weight="700">Role</text>
  <rect x="272" y="670" width="152" height="50" rx="8" class="button"/>
  <text x="290" y="703" class="muted" font-size="18">MBA candidate</text>
