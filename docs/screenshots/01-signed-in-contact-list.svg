<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Signed-in contact list walkthrough evidence</title>
  <desc id="desc">Secure Networking Tracker signed in as Grace Cao with a protected contacts table and contact actions.</desc>
  <defs>
    <style>
      .bg { fill: #f7f8f3; }
      .card { fill: #ffffff; stroke: #d9d8cc; stroke-width: 2; }
      .soft { fill: #f1f3e8; }
      .ink { fill: #202020; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #666a5e; font-family: Arial, Helvetica, sans-serif; }
      .teal { fill: #0f766e; font-family: Arial, Helvetica, sans-serif; }
      .line { stroke: #d9d8cc; stroke-width: 2; }
      .button { fill: #ffffff; stroke: #d9d8cc; stroke-width: 2; }
      .primary { fill: #3f8f83; }
      .danger { fill: #b91c1c; }
      .badge { fill: #fffdf0; stroke: #f0dc83; stroke-width: 1.5; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text x="64" y="74" class="teal" font-size="18" font-weight="700">Neon RLS protected</text>
  <text x="64" y="125" class="ink" font-size="44" font-weight="700">Berkeley Networking Tracker</text>
  <text x="64" y="165" class="muted" font-size="23">Track classmates, alumni, recruiters, and coffee-chat leads.</text>
  <rect x="1240" y="64" width="136" height="56" rx="8" class="button"/>
  <text x="1276" y="100" class="ink" font-size="22" font-weight="700">Refresh</text>

  <rect x="64" y="225" width="410" height="152" rx="8" class="card"/>
