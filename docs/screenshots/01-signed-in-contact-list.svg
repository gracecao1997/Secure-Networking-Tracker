  <text x="209" y="790" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Add contact</text>

  <rect x="514" y="225" width="862" height="92" rx="8" class="card"/>
  <rect x="540" y="248" width="364" height="48" rx="8" class="button"/>
  <text x="564" y="279" class="muted" font-size="19">Search name, company, role, notes</text>
  <rect x="924" y="248" width="148" height="48" rx="8" class="button"/>
  <text x="950" y="279" class="ink" font-size="19">All priorities</text>
  <rect x="1090" y="248" width="158" height="48" rx="8" class="button"/>
  <text x="1133" y="279" class="ink" font-size="19">Newest</text>
  <rect x="1266" y="248" width="84" height="48" rx="8" class="button"/>
  <text x="1294" y="279" class="ink" font-size="19">Desc</text>

  <rect x="514" y="354" width="862" height="190" rx="8" class="card"/>
  <rect x="514" y="354" width="862" height="58" rx="8" class="soft"/>
  <line x1="514" y1="412" x2="1376" y2="412" class="line"/>
  <text x="540" y="390" class="muted" font-size="17" font-weight="700">Name</text>
  <text x="645" y="390" class="muted" font-size="17" font-weight="700">Company</text>
  <text x="806" y="390" class="muted" font-size="17" font-weight="700">Role</text>
  <text x="905" y="390" class="muted" font-size="17" font-weight="700">Where met</text>
  <text x="1055" y="390" class="muted" font-size="17" font-weight="700">Priority</text>
  <text x="1266" y="390" class="muted" font-size="17" font-weight="700">Actions</text>
  <text x="540" y="472" class="ink" font-size="18" font-weight="700">Haasie1</text>
  <text x="645" y="472" class="muted" font-size="18">Berkeley Haas</text>
  <text x="806" y="472" class="muted" font-size="18">-</text>
  <text x="905" y="472" class="muted" font-size="18">-</text>
  <rect x="1054" y="444" width="70" height="34" rx="8" class="badge"/>
  <text x="1068" y="467" fill="#7c3f00" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Medium</text>
  <rect x="1228" y="433" width="70" height="44" rx="8" class="button"/>
  <text x="1252" y="461" class="ink" font-size="17">Edit</text>
  <rect x="1310" y="433" width="48" height="44" rx="8" class="danger"/>
  <text x="1323" y="461" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Del</text>

  <text x="64" y="870" class="muted" font-size="17">Evidence: authenticated user, private contact table, sort/filter controls, edit/delete actions.</text>
