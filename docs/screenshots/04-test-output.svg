  <text x="96" y="118" fill="#d7efe9" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="700">Secure Networking Tracker - local verification</text>
  <text x="96" y="176" fill="#8ef0c4" font-family="Menlo, Consolas, monospace" font-size="22">$ npm test</text>
  <text x="96" y="224" fill="#e7edf0" font-family="Menlo, Consolas, monospace" font-size="20">tests/validation.test.ts</text>
  <text x="96" y="264" fill="#8ef0c4" font-family="Menlo, Consolas, monospace" font-size="20">PASS</text>
