<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Automated test output evidence</title>
  <desc id="desc">Vitest validation tests and production build passed locally.</desc>
