<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Neon schema and RLS evidence</title>
  <desc id="desc">Contacts table uses auth.user_id and separate row level security policies for authenticated users.</desc>
  <rect width="1440" height="820" fill="#f7f8f3"/>
  <text x="64" y="82" fill="#202020" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">Neon Postgres RLS Evidence</text>
  <text x="64" y="122" fill="#666a5e" font-family="Arial, Helvetica, sans-serif" font-size="22">Schema and policies used by the Secure Networking Tracker.</text>

  <rect x="64" y="170" width="620" height="560" rx="8" fill="#ffffff" stroke="#d9d8cc" stroke-width="2"/>
  <text x="94" y="218" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">contacts table</text>
  <text x="94" y="272" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">id uuid primary key default gen_random_uuid()</text>
  <text x="94" y="312" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">user_id text not null default auth.user_id()</text>
  <text x="94" y="352" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">name text not null check length(trim(name)) &gt; 0</text>
  <text x="94" y="392" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">company text not null default ''</text>
  <text x="94" y="432" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">role text not null default ''</text>
  <text x="94" y="472" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">where_met text not null default ''</text>
  <text x="94" y="512" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">notes text not null default ''</text>
  <text x="94" y="552" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">priority text not null check in high/medium/low</text>
  <text x="94" y="592" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">created_at timestamptz not null default now()</text>
  <text x="94" y="632" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">updated_at timestamptz not null updated by trigger</text>

  <rect x="756" y="170" width="620" height="560" rx="8" fill="#ffffff" stroke="#d9d8cc" stroke-width="2"/>
  <text x="786" y="218" fill="#0f766e" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Row Level Security</text>
  <rect x="786" y="254" width="250" height="44" rx="8" fill="#ecfdf5" stroke="#99f6e4" stroke-width="2"/>
  <text x="812" y="283" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">RLS enabled</text>
  <text x="786" y="346" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">select: auth.user_id() = user_id</text>
  <text x="786" y="394" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">insert: with check auth.user_id() = user_id</text>
  <text x="786" y="442" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">update: using auth.user_id() = user_id</text>
  <text x="786" y="490" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">update: with check auth.user_id() = user_id</text>
  <text x="786" y="538" fill="#202020" font-family="Menlo, Consolas, monospace" font-size="18">delete: auth.user_id() = user_id</text>
  <text x="786" y="612" fill="#666a5e" font-family="Arial, Helvetica, sans-serif" font-size="20">Authenticated users can only read or mutate their own contact rows.</text>
  <text x="786" y="650" fill="#666a5e" font-family="Arial, Helvetica, sans-serif" font-size="20">The public Data API URL is protected by these database policies.</text>

  <text x="64" y="780" fill="#666a5e" font-family="Arial, Helvetica, sans-serif" font-size="18">Evidence: Neon schema uses the assignment-required auth.user_id ownership rule and separate CRUD policies.</text>
</svg>
